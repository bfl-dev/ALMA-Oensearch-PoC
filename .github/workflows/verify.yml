name: Verify PoC
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      live:
        description: Run live Docker acceptance (preflight enforces storage budget)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install jsonschema==4.25.1
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: docker compose --env-file .env.example --env-file deployment/images.example.env config --quiet
      - run: git diff --check
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.16'
      - run: python -m pip install uv==0.9.5
      - run: python scripts/preflight.py --pull
      - run: make build
      - run: python scripts/acceptance.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-acceptance-evidence
          path: |
            artifacts/
            requirements.lock
          if-no-files-found: warn
      - if: always()
        run: docker compose --env-file .env --env-file .env.images down

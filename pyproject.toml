[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alma-opensearch-poc"
version = "0.1.0"
description = "Reliable synthetic log capture, ingestion and investigation with OpenSearch"
requires-python = ">=3.12"
dependencies = ["pika==1.4.4", "opensearch-py==3.2.0", "jsonschema==4.25.1"]

[project.scripts]
alma-poc = "alma_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

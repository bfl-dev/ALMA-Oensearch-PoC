name: ${COMPOSE_PROJECT_NAME:-alma-poc}

x-logging: &logging
  driver: json-file
  options:
    max-size: "5m"
    max-file: "2"

x-app: &app
  image: alma-poc:${SOURCE_REVISION:?Run scripts/preflight.py first}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:?Run scripts/preflight.py first}
      SOURCE_REVISION: ${SOURCE_REVISION}
  environment: &app-env
    RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2f
    OPENSEARCH_URL: https://opensearch:9200
    OPENSEARCH_USERNAME: admin
    OPENSEARCH_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:?Run scripts/preflight.py first}
    OPENSEARCH_VERIFY_CERTS: "false"
  logging: *logging
  networks: [poc]

services:
  opensearch:
    image: ${OPENSEARCH_IMAGE:?Run scripts/preflight.py first}
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      action.auto_create_index: "false"
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
    mem_limit: 4g
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes: [search-data:/usr/share/opensearch/data]
    ports: ["127.0.0.1:${POC_OPENSEARCH_PORT:-9200}:9200"]
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --insecure -u "admin:$${OPENSEARCH_INITIAL_ADMIN_PASSWORD}" "https://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 30
    logging: *logging
    networks: [poc]

  rabbitmq:
    image: ${RABBITMQ_IMAGE:?Run scripts/preflight.py first}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    mem_limit: 768m
    volumes:
      - broker-data:/var/lib/rabbitmq
      - ./deployment/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    ports:
      - "127.0.0.1:${POC_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${POC_RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *logging
    networks: [poc]

  dashboards:
    image: ${DASHBOARDS_IMAGE:?Run scripts/preflight.py first}
    environment:
      OPENSEARCH_HOSTS: '["https://opensearch:9200"]'
      OPENSEARCH_SSL_VERIFICATIONMODE: none
    mem_limit: 1536m
    ports: ["127.0.0.1:${POC_DASHBOARDS_PORT:-5601}:5601"]
    depends_on:
      opensearch: {condition: service_healthy}
    logging: *logging
    networks: [poc]

  setup:
    <<: *app
    command: [init]
    mem_limit: 256m
    depends_on:
      opensearch: {condition: service_healthy}

  adapter:
    <<: *app
    command: [adapter, --root, /data/corpus, --state, /data/adapter/checkpoints.sqlite]
    mem_limit: 128m
    volumes:
      - source-data:/data/corpus
      - adapter-state:/data/adapter
    depends_on:
      rabbitmq: {condition: service_healthy}
      setup: {condition: service_completed_successfully}

  worker:
    <<: *app
    command: [worker, --state, /data/worker/quarantine.sqlite]
    mem_limit: 384m
    volumes: [worker-state:/data/worker]
    depends_on:
      rabbitmq: {condition: service_healthy}
      setup: {condition: service_completed_successfully}

  api:
    <<: *app
    command: [api, --root, /data/corpus]
    mem_limit: 128m
    volumes: [source-data:/data/corpus]
    ports: ["127.0.0.1:${POC_API_PORT:-8080}:8080"]
    profiles: [live]

  tools:
    <<: *app
    mem_limit: 384m
    profiles: [tools]
    volumes:
      - source-data:/data/corpus
      - adapter-state:/data/adapter
      - worker-state:/data/worker
      - report-data:/data/artifacts

networks:
  poc: {}

volumes:
  search-data: {}
  broker-data: {}
  source-data: {}
  adapter-state: {}
  worker-state: {}
  report-data: {}
